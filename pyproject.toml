[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsarfold"
version = "0.1.0"
description = "A compact workbench for pulsar observation analysis"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
  {name = "Loren", email = "lorenhey@example.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "astropy>=6.0.0",
    "PySide6>=6.6.0",
    "pyqtgraph>=0.13.3",
    "matplotlib>=3.8.0",
    "h5py>=3.10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black",
    "ruff",
]

[project.scripts]
pulsarfold = "pulsarfold.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
